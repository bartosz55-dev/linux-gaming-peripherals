<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)" stroke="#2B2D3A" stroke-width="2"/>

  <!-- SteelSeries Target / Prism Rings -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#FF5200" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#FF5200" stroke-width="4" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="12" fill="#FF5200" filter="url(#glow)"/>

  <!-- Mouse Silhouette Accents -->
  <path d="M 46 36 C 46 28, 54 22, 64 22 C 74 22, 82 28, 82 36 L 82 50 L 46 50 Z" fill="#2A2D3C" fill-opacity="0.6"/>
  <rect x="62" y="26" width="4" height="14" rx="2" fill="#FF5200"/>
</svg>
